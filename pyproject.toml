[project]
name = "codex-statusline"
version = "0.1.2"
description = "A tmux statusline for OpenAI Codex CLI: context usage, 5h and weekly quota, and session tokens at a glance. Local-only."
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [{ name = "Zimo Xu" }]
keywords = ["codex", "codex-cli", "openai", "statusline", "tmux", "quota", "tokens", "terminal"]
classifiers = [
    "Environment :: Console",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Terminals",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://github.com/Moviw/codex-statusline"
Issues = "https://github.com/Moviw/codex-statusline/issues"
Changelog = "https://github.com/Moviw/codex-statusline/blob/main/CHANGELOG.md"

[project.scripts]
codex-statusline = "src.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
